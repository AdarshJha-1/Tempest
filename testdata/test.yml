name: "Tempest Example"

target: "http://localhost:6969"

duration: "1m"

concurrency: 2

scenarios:
  - name: "Get Products"
    weight: 60
    request:
      method: GET
      path: "/products"
      query:
        page: "1"
        limit: "10"

  - name: "Login"
    weight: 40
    request:
      method: POST
      path: "/login"
      headers:
        Content-Type: application/json
        X-Client: Tempest
      body:
        email: "demo@test.com"
        password: "123456"
